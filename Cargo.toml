[package]
name = "ghe2d"
version = "0.2.3"
rust-version = "1.80"
edition = "2021"
description = "A simple 2D image canvas: anti-aliased shapes, real text shaping (Arabic / RTL / bidi), image compositing, and PNG / JPEG / WebP export — all through a small builder API."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Ghe2d/Ghe2d"
homepage = "https://github.com/Ghe2d/Ghe2d"
keywords = ["canvas", "graphics", "2d", "text-rendering", "image"]
categories = ["graphics", "multimedia::images", "rendering"]
authors = ["clove7 hlever.dev@gmail.com"]
include = ["src/**/*.rs", "tests/**/*.rs", "tests/golden/*.png", "examples/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
image = "0.25.10"
rusttype = "0.9.3"
ab_glyph_rasterizer = "0.1.10"
rustybuzz = "0.20.1"
unicode-bidi = "0.3.18"
regex = "1.13.1"
reqwest = "0.13.5"
png = "0.18.1"
libwebp-sys = "0.14.4"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
