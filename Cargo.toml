[package]
name = "ghe2d"
version = "0.2.0"
rust-version = "1.80"
edition = "2021"
description = "A tool easy to make shapes"
readme = "README.md"
license = "ISC"
keywords = ["canvas", "shapes", "2d"]
authors = ["Hlever hlever.dev@gmail.com"]
include = ["**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE.md"]

[dependencies]
image = "0.25.6"
rusttype = "0.9.3"
rustybuzz = "0.20"
unicode-bidi = "0.3"
regex = "1.11.1"
reqwest = "0.12.15"
png = "0.18.1"
libwebp-sys = "0.14.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
